<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Soccer Player Career — Slots (Edge playable)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="slides">
    <!-- Slide 1: Fullscreen Slots -->
    <section id="slots-screen" class="slide">
      <header class="hero">
        <h1>Soccer Player Career</h1>
        <p class="lead">Tap a slot to begin — big, vibrant, and optimized for Microsoft Edge.</p>
      </header>

      <main class="slots-grid">
        <button class="big-slot" data-slot="0">
          <div class="slot-label">Slot 1</div>
          <div class="slot-meta" data-slot-meta="0">Empty</div>
        </button>
        <button class="big-slot" data-slot="1">
          <div class="slot-label">Slot 2</div>
          <div class="slot-meta" data-slot-meta="1">Empty</div>
        </button>
        <button class="big-slot" data-slot="2">
          <div class="slot-label">Slot 3</div>
          <div class="slot-meta" data-slot-meta="2">Empty</div>
        </button>
      </main>

      <footer class="footer muted">Each slot stores its profile in your browser. Use the arrows in the editor to return to slots.</footer>
    </section>

    <!-- Slide 2: Editor (full page) -->
    <section id="editor-screen" class="slide">
      <div class="editor-top">
        <button id="back-button" class="secondary">← Back to Slots</button>
        <div class="editor-title">Create / Edit Player — <span id="editor-slot-label">Slot ?</span></div>
      </div>

      <div class="editor-body">
        <div class="left-col">
          <label class="big-label">Name</label>
          <input id="edit-name" class="big-input" type="text" placeholder="Player name" />

          <label class="big-label">Choose Nation</label>
          <input id="nation-search" class="big-input" placeholder="Search nation..." />
          <div id="nation-list" class="picker-grid"></div>
        </div>

        <div class="right-col">
          <label class="big-label">Position</label>
          <div id="position-list" class="positions-grid"></div>

          <label class="big-label">Choose Team</label>
          <input id="team-search" class="big-input" placeholder="Search team or league..." />
          <div id="team-list" class="picker-grid team-grid"></div>

          <div class="editor-actions">
            <button id="apply-btn">Apply & Save to Slot</button>
            <button id="download-profile" class="secondary">Download profile.json</button>
            <button id="download-log" class="secondary">Download career_log.md</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
